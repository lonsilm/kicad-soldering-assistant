name: Build Windows application
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build single-file native EXE
        run: python desktop/build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: KiCad-Soldering-Assistant-Windows
          path: |
            dist/KiCad焊接助手.exe
            dist/EXE_BUILD.json
